<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Gradient Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="12" />

  <!-- Shield Shape Background -->
  <path d="M256 80 L396 144 V264 C396 352 332 416 256 448 C180 416 116 352 116 264 V144 Z" 
        fill="url(#primaryGrad)" 
        opacity="0.15" />
  
  <path d="M256 100 L376 156 V260 C376 336 320 392 256 420 C192 392 136 336 136 260 V156 Z" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="16" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Sparkle Vault Core Emblem -->
  <g transform="translate(256, 260)">
    <!-- Central Diamond Core -->
    <path d="M0 -70 L20 -20 L70 0 L20 20 L0 70 L-20 20 L-70 0 L-20 -20 Z" fill="url(#primaryGrad)" />
    <!-- Inner Radiant Sparkle -->
    <path d="M0 -40 L12 -12 L40 0 L12 12 L0 40 L-12 12 L-40 0 L-12 -12 Z" fill="#FFFFFF" />
    <!-- Secondary Orbiting Dots -->
    <circle cx="-54" cy="-54" r="8" fill="#06B6D4" />
    <circle cx="54" cy="54" r="8" fill="#3B82F6" />
    <circle cx="54" cy="-54" r="6" fill="#6366F1" opacity="0.8" />
    <circle cx="-54" cy="54" r="6" fill="#6366F1" opacity="0.8" />
  </g>
</svg>
